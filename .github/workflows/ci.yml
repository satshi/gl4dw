name: CI

on:
  push:
  pull_request:

jobs:
  linux-core:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build g++ nlohmann-json3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DGL4DW_BUILD_VIEWER=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
